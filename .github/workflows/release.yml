name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"

jobs:
  release:
    name: build and publish release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # A release must never ship code that does not pass the gate.
      - name: verify
        run: |
          go vet -all ./...
          go test -count=1 ./...

      - name: build archives
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          make dist VERSION="$RELEASE_TAG"

      - name: list artifacts
        run: ls -la dist && cat dist/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
