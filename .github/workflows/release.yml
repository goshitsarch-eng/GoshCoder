name: Release

# Three ways in, one code path:
#
#   * pushing a v* tag, the ordinary route;
#   * pushing a release/v* branch, which cuts the tag named after it;
#   * a manual run, which names the tag and the ref to cut it from.
#
# The last two exist because pushing a tag needs credentials that not every
# environment has. A token scoped to refs/heads/* cannot create refs/tags/*,
# and an integration without actions: write cannot press "Run workflow"
# either -- between them that can leave no way to cut a release at all. The
# workflow's own GITHUB_TOKEN has contents: write, so it creates the tag
# itself, and a branch push is a write that a branch-scoped token does have.
#
# A push made with GITHUB_TOKEN deliberately does not trigger another workflow
# run, so creating the tag here cannot start a second release of the same
# version. Cutting a release still requires push access to this repository,
# which is what pushing a tag required before; this grants nobody anything new.
#
# The release/v* branch is only a trigger. It is left in place afterwards --
# deleting someone's branch out from under them to tidy up would be worse than
# the clutter -- and is safe to delete once the release is published.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0. Created if it does not exist."
        required: true
      ref:
        description: "Branch or commit to tag. Defaults to the branch this run was started from. Ignored when the tag already exists."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish release archives
    runs-on: ubuntu-latest
    steps:
      # Inputs reach the shell through the environment rather than through
      # ${{ }} interpolation: a manual run and a branch name are the paths
      # where they arrive as free text, and expanding free text into a script
      # is how a workflow with contents: write gets turned into someone else's.
      - name: resolve the release tag
        id: release
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          # may_create records whether this run is allowed to bring a tag into
          # existence. A tag push cannot be: the tag it names is the one thing
          # that must already exist.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            checkout="${INPUT_REF:-$REF_NAME}"
            may_create=yes
          else
            case "$REF" in
              refs/tags/*)
                tag="$REF_NAME"
                checkout="$REF"
                may_create=no
                ;;
              refs/heads/release/*)
                # release/v1.2.3 cuts v1.2.3 from that branch's head.
                tag="${REF_NAME#release/}"
                checkout="$REF_NAME"
                may_create=yes
                ;;
              *)
                echo "::error::$REF does not name a release"
                exit 1
                ;;
            esac
          fi

          # Reject anything that is not a single line before any pattern test.
          # grep is line-oriented, so "v1.2.3\ntag=evil" satisfies a ^...$
          # pattern on its first line -- and then the second line writes another
          # "tag=" assignment into $GITHUB_OUTPUT, where the last assignment is
          # the one that wins. Validating the pattern first would authorise a
          # value that never reaches the later steps.
          for value in "$tag" "$checkout"; do
            if [ "$(printf '%s' "$value" | head -n 1)" != "$value" ]; then
              echo "::error::release inputs must each be a single line"
              exit 1
            fi
          done

          # The tag becomes a git ref, the archive filenames, and the version
          # the binary reports.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::release tag must look like v1.2.3 or v1.2.3-rc.1, got '$tag'"
            exit 1
          fi
          # The source ref is a branch, tag, or commit; anything outside this
          # set is not one, and it lands in $GITHUB_OUTPUT just as the tag does.
          if ! printf '%s' "$checkout" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::source ref must be a branch, tag, or commit, got '$checkout'"
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'checkout=%s\n' "$checkout"
            printf 'may_create=%s\n' "$may_create"
          } >>"$GITHUB_OUTPUT"
          echo "releasing $tag from $checkout"

      # Checked out without a ref: whatever triggered the run always resolves,
      # where the source ref named by a manual run might not. Which commit gets
      # built is decided in the next step, once the tags are on disk and an
      # existing tag can be told from one still to be created.
      - uses: actions/checkout@v4
        with:
          # All refs, so an existing tag is visible and `git describe` in the
          # Makefile has the history it needs.
          fetch-depth: 0

      - name: check out the commit to release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHECKOUT: ${{ steps.release.outputs.checkout }}
          MAY_CREATE: ${{ steps.release.outputs.may_create }}
        run: |
          set -eu
          git fetch --tags --prune --force origin

          # An existing tag is built as it stands rather than as its branch has
          # since become -- and the source ref is genuinely ignored here, which
          # is what the manual run's input promises.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; building it as it stands"
            git checkout -q --detach "refs/tags/$TAG"
            exit 0
          fi
          if [ "$MAY_CREATE" != "yes" ]; then
            echo "::error::$TAG triggered this run but no longer exists"
            exit 1
          fi

          git checkout -q --detach "origin/$CHECKOUT" 2>/dev/null \
            || git checkout -q --detach "$CHECKOUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "GoshCoder $TAG"
          git push origin "refs/tags/$TAG"
          echo "created and pushed $TAG at $(git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu,aarch64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-zigbuild

      # A release must never ship code that does not pass the gate.
      - name: verify
        run: |
          make check
          cargo audit

      - name: build archives
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          make dist VERSION="$RELEASE_TAG"

      - name: list artifacts
        run: ls -la dist && cat dist/checksums.txt

      # tag_name is explicit because on a manual run, or a release-branch push,
      # github.ref is a branch; without it the release would be published
      # against that branch instead of the tag the archives were built for.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
