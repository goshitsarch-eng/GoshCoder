name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --locked --all-targets

      - name: cargo test
        run: cargo test --locked --all-targets

      # Tests must not read credentials injected by a runner or developer
      # environment. Deliberately invalid values expose accidental leakage.
      - name: cargo test (hermeticity probe)
        env:
          AWS_ACCESS_KEY_ID: hermeticity-probe
          AWS_SECRET_ACCESS_KEY: hermeticity-probe
          AWS_REGION: hermeticity-probe
          AWS_PROFILE: hermeticity-probe
        run: cargo test --locked --all-targets

  lint:
    name: rustfmt, clippy, cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo audit
        run: cargo audit

  # The release archives are built the way release.yml builds them: Linux
  # and Windows cross-compiled from Linux with cargo-zigbuild, the Apple
  # targets natively on macOS because they link the Security framework and
  # therefore need the macOS SDK. aarch64-pc-windows-gnu has no rust-std on
  # stable and the MSVC target cannot be linked from Linux, so Windows ships
  # amd64 only.
  release-targets:
    name: release targets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu
          - os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
        if: runner.os == 'Linux'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild
      - name: install zip
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      # The Makefile picks the platforms and the builder from the host.
      - name: build this host's release targets
        run: make dist
      - name: list artifacts
        run: ls -la dist

  installer:
    name: installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The round-trip check builds the linux/amd64 release archive.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh install.sh

      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - name: install.sh builds and installs from source
        run: |
          sh install.sh --from-source --dir "$RUNNER_TEMP/bin" --no-modify-path
          "$RUNNER_TEMP/bin/goshcoder" version

      # The Makefile and the installer derive archive names independently.
      # Exercise a served archive to prevent release-only 404 regressions.
      - name: release archives match what the installers request
        run: sh scripts/release-roundtrip.sh v9.9.9
