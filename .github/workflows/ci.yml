name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Earlier Go 1.26 patch releases carry standard-library vulnerabilities that
  # govulncheck reports as reachable from this tree.
  GO_VERSION: "1.26.6"

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet -all ./...

      - name: go test
        shell: bash
        run: go test -count=1 ./...

      # The suite must ignore ambient provider credentials rather than reading
      # whatever the runner or a developer shell happens to export. Setting
      # obviously-wrong values catches any test that silently inherits them.
      - name: go test (hermeticity probe)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: hermeticity-probe
          AWS_SECRET_ACCESS_KEY: hermeticity-probe
          AWS_REGION: hermeticity-probe
          AWS_PROFILE: hermeticity-probe
        run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./...

  lint:
    name: gofmt, staticcheck, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: build every release target
        run: |
          set -eu
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            echo "::group::$os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/goshcoder
            echo "::endgroup::"
          done

  installer:
    name: installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh install.sh

      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - name: install.sh builds and installs from source
        run: |
          sh install.sh --from-source --dir "$RUNNER_TEMP/bin" --no-modify-path
          "$RUNNER_TEMP/bin/goshcoder" version
