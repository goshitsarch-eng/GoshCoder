[package]
name = "goshcoder"
version = "0.5.0"
edition = "2024"
description = "A Rust coding agent with a Ratatui terminal interface"
license = "MIT"
repository = "https://github.com/goshitsarch-eng/GoshCoder"

[[bin]]
name = "goshcoder"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
