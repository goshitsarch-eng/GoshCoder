[package]
name = "goshcoder"
version = "0.5.0"
edition = "2024"
description = "A Rust coding agent with a Ratatui terminal interface"
license = "MIT"
repository = "https://github.com/goshitsarch-eng/GoshCoder"

[[bin]]
name = "goshcoder"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
