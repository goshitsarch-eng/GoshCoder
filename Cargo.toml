[package]
name = "goshcoder"
version = "0.5.0"
edition = "2024"
description = "A Rust coding agent with a Ratatui terminal interface"
license = "MIT"
repository = "https://github.com/goshitsarch-eng/GoshCoder"

[[bin]]
name = "goshcoder"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = "1.1.10"
hmac = "0.13.0"
libc = "0.2.189"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "http2"] }
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
